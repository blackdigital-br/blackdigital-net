name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip version-bump commits
        run: |
          if git log -1 --pretty=%s | grep -q "^chore: bump version to"; then
            echo "Commit is a version bump. Skipping to avoid loop."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Setup .NET
        if: env.SKIP == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate version (YY.MM.dd.HH)
        if: env.SKIP == 'false'
        id: version
        run: echo "version=$(date +'%y.%m.%d.%H')" >> $GITHUB_OUTPUT

      - name: Bump version in csproj
        if: env.SKIP == 'false'
        run: |
          sed -i "s|<Version>[0-9.]*</Version>|<Version>${{ steps.version.outputs.version }}</Version>|" src/BlackDigital.csproj
          echo "Version set to ${{ steps.version.outputs.version }}"

      - name: Restore
        if: env.SKIP == 'false'
        run: dotnet restore BlackDigital.sln

      - name: Run tests
        if: env.SKIP == 'false'
        run: dotnet test BlackDigital.sln --configuration Release --no-restore

      - name: Build Release
        if: env.SKIP == 'false'
        run: dotnet build BlackDigital.sln --configuration Release --no-restore

      - name: Commit and tag
        if: env.SKIP == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/BlackDigital.csproj
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        if: env.SKIP == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            src/bin/Release/net10.0/BlackDigital.dll
            src/bin/Release/net10.0/BlackDigital.xml
            src/bin/Release/*.nupkg

      - name: NuGet login (Trusted Publishing)
        if: env.SKIP == 'false'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: env.SKIP == 'false'
        run: dotnet nuget push src/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
